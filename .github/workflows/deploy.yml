name: Deploy

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'release' && 'production' || 'preview' }}
    concurrency: ${{ github.event_name == 'release' && 'production' || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node.js 26 no longer ships corepack, so pnpm is installed as a standalone binary.
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.18.0
          runtime: node@26
          install: false
          cache: true
          cache-dependency-path: |
            app/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        working-directory: backend
        run: pnpm test --coverage

      - name: Build backend
        working-directory: backend
        run: pnpm build

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Test app
        working-directory: app
        run: pnpm test

      - name: Build React app
        working-directory: app
        run: pnpm run build
        env:
          # Keeps the preview environment out of search results.
          NOINDEX: ${{ github.event_name != 'release' && '1' || '' }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: OpenTofu Init
        working-directory: infra
        run: tofu init -backend-config="bucket=${{ vars.STATE_BUCKET }}" -backend-config="key=${{ github.event_name == 'release' && 'werte' || 'werte-preview' }}/terraform.tfstate"

      - name: OpenTofu Apply
        working-directory: infra
        run: tofu apply -auto-approve
        env:
          TF_VAR_project: ${{ github.event_name == 'release' && 'werte' || 'werte-preview' }}
          TF_VAR_domain: ${{ vars.DOMAIN }}
          TF_VAR_zone_id: ${{ vars.ZONE_ID }}
          # Set only in the production environment, AWS Budgets are per account.
          TF_VAR_budget_email: ${{ vars.BUDGET_EMAIL }}

      - name: Deploy static assets to S3
        working-directory: infra
        run: |
          BUCKET=$(tofu output -raw s3_bucket_name)
          aws s3 sync ../app/dist/ s3://$BUCKET/ --delete

      - name: Invalidate CloudFront cache
        id: invalidate
        working-directory: infra
        run: |
          DIST_ID=$(tofu output -raw cloudfront_distribution_id)
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" --query Invalidation.Id --output text)
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      # The end-to-end test creates tests and scenarios, so it runs only against
      # the preview environment to keep the production data clean.
      - name: Install Playwright browser
        if: github.event_name != 'release'
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for CloudFront invalidation
        if: github.event_name != 'release'
        run: aws cloudfront wait invalidation-completed --distribution-id "${{ steps.invalidate.outputs.dist_id }}" --id "${{ steps.invalidate.outputs.invalidation_id }}"

      - name: Run end-to-end test
        if: github.event_name != 'release'
        working-directory: app
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: https://${{ vars.DOMAIN }}

      - name: Upload Playwright report
        if: failure() && github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14
